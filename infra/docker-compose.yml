services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "${PAYMENTS_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${PAYMENTS_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
    volumes:
      - ../backend:/app
    extra_hosts:
      - "host.docker.internal:172.20.0.1"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      REDIS_URL: redis://redis:6379/0
      HELM_AUTH_BASE_URL: http://host.docker.internal:8001
      HELM_INTERNAL_API_SECRET: ${HELM_AUTH_HELM_INTERNAL_API_SECRET:?HELM_AUTH_HELM_INTERNAL_API_SECRET must be set}
      DEMO_SECRET: ${PAYMENTS_DEMO_SECRET:-change-me}
      SCRIPE_PROVISIONING_SECRET: ${SCRIPE_PROVISIONING_SECRET:?SCRIPE_PROVISIONING_SECRET must be set}
      AUTO_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PAYMENTS_BACKEND_PORT:-18000}:8000"
    command: >-
      sh -c "./scripts/start_backend.sh"

  worker:
    build:
      context: ../backend
    volumes:
      - ../backend:/app
    extra_hosts:
      - "host.docker.internal:172.20.0.1"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      REDIS_URL: redis://redis:6379/0
      HELM_AUTH_BASE_URL: http://host.docker.internal:8001
      DEMO_SECRET: ${PAYMENTS_DEMO_SECRET:-change-me}
      AUTO_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "watchfiles --filter python --run-process 'celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=1' /app/app"

  dashboard:
    build:
      context: ../dashboard
    volumes:
      - ../dashboard:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:${PAYMENTS_BACKEND_PORT:-18000}
      VITE_DEMO_SECRET: ${PAYMENTS_DEMO_SECRET:-change-me}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${PAYMENTS_DASHBOARD_PORT:-5174}:5173"

volumes:
  postgres_data:
  dashboard_node_modules:
